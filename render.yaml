# Render.com Blueprint — Küt oyun sunucusu (WebSocket).
# Render panelinde: New → Blueprint → bu depoyu seç. Ücretsiz planda 15 dk boşta kalınca uyur,
# ilk bağlantıda ~1 dk içinde uyanır.
services:
  - type: web
    name: kut-server
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start -w @kut/server
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Sadece oyunun yayınlandığı adresten bağlantı kabul et
      - key: ALLOWED_ORIGINS
        value: https://thorehan.github.io
